allowBuilds:
  canvas: true
  core-js: false
  electron-winstaller: true
  esbuild: true
onlyBuiltDependencies:
  - esbuild
  - electron-winstaller

# Security overrides. These live HERE and not in package.json: pnpm v11 stopped
# reading the `pnpm` field there and silently ignores it, so an override placed
# in package.json resolves to nothing and looks like "the override did not work".
#
# All four are PATCH bumps inside the same major, so none can pull a breaking
# change. Range-scoped because three majors of brace-expansion are in the tree
# at once and each needs its own patched line.
overrides:
  brace-expansion@1: 1.1.16
  brace-expansion@2: 2.1.2
  brace-expansion@5: 5.0.7
  fast-uri: 3.1.4
