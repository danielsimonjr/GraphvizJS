name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    # Windows-only app (Windows is the sole packaging target), so CI runs on
    # Windows — Electron e2e runs natively here (no xvfb / no --no-sandbox).
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bun run typecheck

      - name: Check architecture invariants (dependency graph)
        run: bun run graph:check

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build renderer + main + preload
        run: bun run build

      - name: Run E2E tests (Electron)
        run: bun run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14

  docs:
    name: architecture documents and doc comments match the code
    # The checks only read files, so any runner works. Linux starts faster than Windows.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The version is exact. A new release of repo-tools can change how it counts, or what it
      # accepts as plain text, and turn this job red with no change to the code. Raise the pin on
      # purpose, after a local run of the commands below.
      REPO_TOOLS_VERSION: 2.2.7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install repo-tools
        run: npm install --global --ignore-scripts "@danielsimonjr/repo-tools@${REPO_TOOLS_VERSION}"

      # The hand-written documents end in a Verification table of counts. The check parses the
      # source again and fails when a document claims a count that the parse does not give.
      - name: Architecture claims match the source
        run: repo-tools check . --docs=docs/architecture

      # The check above never opens the generated reports, so a stale report would pass it. This
      # step writes a fresh map outside the repository and compares each committed report with it.
      # `bun run graph` writes DEPENDENCY_GRAPH.md and dependency-graph.json, so they are not in
      # the list.
      - name: Generated reports match a fresh map
        run: |
          repo-tools map . --out=../map-check
          status=0
          for name in FILE_INVENTORY.md file-inventory.json unused-analysis.md unused-analysis.json duplicate-symbols.md duplicate-symbols.json; do
            diff -u "docs/architecture/$name" "../map-check/$name" || status=1
          done
          exit "$status"

      # The check covers every document in docs/architecture, the generated reports included,
      # and the README. The tool exits 2 when a path does not exist, so a renamed folder fails here.
      - name: Architecture documents and the README are in Simplified Technical English
        run: repo-tools ste docs/architecture README.md

      # An exported symbol with no doc comment fails here, not in review. The loop checks all
      # four folders, so one run reports every folder that fails.
      - name: Exported symbols have doc comments
        run: |
          status=0
          for dir in src core cli electron; do
            repo-tools docs check "$dir" || status=1
          done
          exit "$status"
